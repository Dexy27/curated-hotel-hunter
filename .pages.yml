media:
  input: deal-photos
  output: /deal-photos
  extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: hotel-deals
    label: Hotel Deals
    type: file
    path: hotel-deals.json
    format: json
    fields:
      - name: deals
        label: Deals
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Hotel name
            type: string
            required: true
          - name: location
            label: Destination
            type: string
          - name: price
            label: Price
            description: "Include the currency and what the price covers, e.g. €1,250 for 7 nights."
            type: string
            required: true
          - name: description
            label: Deal description
            description: "Include stay dates, room type, inclusions and any important booking conditions."
            type: text
            required: true
          - name: photos
            label: Hotel photos
            type: object
            list:
              max: 6
              collapsible:
                summary: "{alt}"
            fields:
              - name: image
                label: Photo
                type: image
                required: true
                options:
                  rename: safe
              - name: alt
                label: Short photo description
                type: string
                required: true
          - name: bookingUrl
            label: Hotel or booking link
            description: "Optional. Paste the full link starting with https://."
            type: string
